name: Historia de usuario
description: Necesidad de un usuario, con criterios de aceptación
title: "HUxx · "
labels: ["tipo:historia"]
body:
  - type: input
    id: epica
    attributes:
      label: Épica
      placeholder: "#n"
    validations:
      required: true
  - type: textarea
    id: historia
    attributes:
      label: Historia
      value: "Como **<rol>**, quiero <acción>, para <resultado>."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: puntos
    attributes:
      label: Puntos (Fibonacci)
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
